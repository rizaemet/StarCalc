<!doctype html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StarCalc · Scrap Clicker 2 Yıldız Hesaplayıcı</title>
  <meta name="description" content="Scrap Clicker 2 için yıldız yükseltme maliyeti hesaplayıcı: Altın Hurda, Mıknatıs ve Yıldız Parçası.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#12141c">
  <link rel="icon" type="image/png" href="imgs/Star.png">
  <link rel="stylesheet" href="css/site.css">
  <script src="js/site.js" defer></script>
</head>

<body>
  <main class="app">
    <header class="app-header">
      <img src="imgs/Star.png" alt="" width="48" height="48">
      <div>
        <h1>StarCalc</h1>
        <p>Scrap Clicker 2 yıldız yükseltme maliyeti</p>
      </div>
    </header>

    <section class="card" aria-labelledby="starsTitle">
      <div class="card-head">
        <h2 id="starsTitle">Yıldız Seviyeleri</h2>
        <label class="inline-field">
          <span>Hepsini ayarla</span>
          <input id="setAll" type="text" inputmode="numeric" autocomplete="off" placeholder="Seviye">
        </label>
      </div>
      <div class="star-grid" id="starGrid"></div>
      <template id="starTemplate">
        <label class="star">
          <span class="star-index"></span>
          <input type="text" inputmode="numeric" autocomplete="off" placeholder="0" maxlength="5">
        </label>
      </template>
    </section>

    <section class="card" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle">Ayarlar</h2>
      <div class="fields">
        <label class="field">
          <span>Başarılar indirimi</span>
          <span class="input-wrap" data-unit="%">
            <input id="arch" type="number" inputmode="decimal" min="0" max="20" step="0.1" placeholder="0">
          </span>
          <small>0 – 20 arası</small>
        </label>
        <label class="field">
          <span>Ustalık çarpanı</span>
          <span class="input-wrap" data-unit="×">
            <input id="master17" type="number" inputmode="decimal" min="0" max="1" step="0.01" placeholder="1">
          </span>
          <small>0 – 1 arası</small>
        </label>
        <label class="field">
          <span>Çöplük v2 seviyesi</span>
          <input id="v2" type="number" inputmode="numeric" min="0" step="1" placeholder="0">
        </label>
        <label class="field field-accent">
          <span>Hedef yıldız</span>
          <input id="target" type="number" inputmode="numeric" min="0" step="1" placeholder="Örn. 500">
        </label>
      </div>
    </section>

    <section class="card results" aria-labelledby="resultsTitle">
      <div class="card-head">
        <h2 id="resultsTitle">Gerekli Kaynaklar</h2>
        <button id="reset" type="button" class="btn-ghost">Sıfırla</button>
      </div>
      <p id="summary" class="summary" aria-live="polite"></p>
      <div class="result-grid">
        <div class="result">
          <img src="imgs/GoldenScrap.png" alt="" width="40" height="40">
          <div>
            <span class="result-label">Altın Hurda</span>
            <output id="gs">0</output>
          </div>
        </div>
        <div class="result">
          <img src="imgs/magnet.png" alt="" width="40" height="40">
          <div>
            <span class="result-label">Mıknatıs</span>
            <output id="mag">0</output>
          </div>
        </div>
        <div class="result">
          <img src="imgs/starfragment.png" alt="" width="40" height="40">
          <div>
            <span class="result-label">Yıldız Parçası</span>
            <output id="fragment">0</output>
          </div>
        </div>
      </div>
      <p class="hint">Tam değeri görmek için sayının üzerine gelin. Boş bırakılan yıldızlar hesaba katılmaz.</p>
    </section>

  </main>
</body>

</html>
